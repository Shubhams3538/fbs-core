name: Go

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module hygiene
        run: |
          go mod tidy -diff
          go mod verify

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Build test-endpoint binary
        run: go build -tags testendpoints ./cmd/server

  test-race:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests with race detector
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run staticcheck
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 -tags testendpoints ./...

      # deadcode exits 0 even when it finds unreachable functions, so fail on any output.
      - name: Check for unreachable code
        run: |
          unreachable="$(go run golang.org/x/tools/cmd/deadcode@v0.50.0 -test ./...)"
          if [ -n "$unreachable" ]; then
            echo "$unreachable"
            exit 1
          fi

  regression-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Prove regression sensitivity
        shell: bash
        run: python3 scripts/verify-test-regressions.py | tee regression-sensitivity.log

      - name: Prove compiled-server HTTP behavior
        shell: bash
        run: python3 scripts/prove-production-audit.py | tee production-http-proof.json

      - name: Save proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-regression-proof
          path: |
            regression-sensitivity.log
            production-http-proof.json
